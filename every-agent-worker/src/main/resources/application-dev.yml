
worker:
  worker-id: ${WORKER_ID:company-pc-dev}
  # dev profile 同样不带任何默认密钥(fail-closed):本机起 hub 后 export 两个环境变量即可
  #   HUB_KEY=<与 hub 相同的原始密钥>            # hub 侧 application-dev.yml 的 --hub.hub-key 同值
  #   WORKER_API_KEY=<本地任选的非空串,如 dev>   # apiKey 定义数据归属,本地开发随便取
  # (或写 ~/.everyagent-dev/application-worker.yaml 覆盖 worker.hubs 列表)
  hubs:
    - url: ws://localhost:8100/ws
      api-key: ${WORKER_API_KEY:}
      # 连接 hub 的凭证(对 hub 的保护);与 api-key 不同,由部署者统一配置。必填:
      # 原始密钥须与目标 hub 的 hub.hub-key(存其 sha256)对应,缺失该条目 worker 拒绝启动
      hub-key: ${HUB_KEY:}
  # 系统目录(架构 §5.9):默认工作区 workspace/、数据 data/;空 = ~/.everyagent
  home-dir: ${user.home}/.everyagent-dev
  # 开发运行恢复控制台日志与启动横幅(打包默认 OFF,防 worker.out.log 无限膨胀,见 application.yml)
  console-log-threshold: debug
server:
  port: 8200
  address: 127.0.0.1 # 管理端口仅本机(架构 §2.2)
spring:
  # application.yml 里的 import 解析时看不到本文件(dev profile 后加载),dev home-dir 的
  # application-worker.yaml 须在这里再引入一次;${worker.home-dir} 取本文件上面的 dev 值。
  config:
    import: optional:file:${worker.home-dir}/application-worker.yaml
  main:
    banner-mode: console

# 任务生命周期链路诊断日志(排查"新任务不落盘/节点未执行/链中断"类问题):
# TaskLifecycleExecutor 输出每个节点的进入/返回/异常([chain] 前缀),TaskStore 输出 track/dirOf,
# 生命周期节点输出各分支([entry]/[vt]/[track]/[ws]/[idgen] 前缀)。排查完成后可调回 INFO。
logging:
  level:
    dev.everyagent.worker.task.AgentRunner: debug
    dev.everyagent.worker.task.TaskManager: debug
    dev.everyagent.plugin.subagent: debug
    dev.everyagent.worker.task.WorkerToolEventAdvisor: debug
    dev.everyagent.worker.task.TaskStore: debug
    dev.everyagent.worker.task.lifecycle: debug
    # file-change 插件链路诊断(轮末文件变更面板:收口跳过原因/collector 暂存/分片落盘与 RPC 命中):
    dev.everyagent.plugin.filechange: debug
    # 工具执行/沙箱执行明细(生产默认 INFO,见 application.yml;dev 下保留原有排障粒度):
    dev.everyagent.worker.tools: debug
    dev.everyagent.worker.os: debug
    dev.everyagent.worker.task: debug
    dev.everyagent.worker.agent: debug
    # HTTP 层请求/响应原始报文打印(排障缓存命中字段等,排查后调回 info):
    dev.everyagent.worker.http.HttpRequestLoggingInterceptor: debug