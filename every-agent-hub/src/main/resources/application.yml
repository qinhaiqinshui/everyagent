server:
  port: 6101
  # 默认仅监听回环(安全整改:未配置时不再绑 0.0.0.0 全网卡);公网/容器部署由部署层显式放开
  # (docker-compose.yml 与 deploy.py 均注入 SERVER_ADDRESS=0.0.0.0,保持既有对外行为)。
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: every-agent-hub
  # banner 走 stdout:desktop 重定向下会追加进永不轮转的 hub.out.log,默认关闭;
  # dev profile 置 console 恢复 IDE 启动横幅(与 console-log-threshold 同理)
  main:
    banner-mode: "off"
  # 用户配置覆盖:存在 ~/.everyagent/application-hub.yaml 则覆盖本文件默认值(后加载、优先级更高);
  # optional: 前缀 = 文件不存在自动忽略,无自定义则零配置文件(hub 不感知部署方式)。
  # 注意必须用 spring.config.import 而非 additional-location:后者只在定位配置文件之前从
  # 环境变量/系统属性/命令行读取,写在 application.yml 里会被静默忽略;import 才是"文件内
  # 引入外部文件"的机制,被导入者优先级更高。
  config:
    import: optional:file:${EVERYAGENT_HOME:${user.home}/.everyagent}/application-hub.yaml

hub:
  # 必填。直接填原始 hub key(与前端设置页、worker hubs[].hub-key 同一密钥),程序启动时
  # 自行计算 sha256 用于比对——无需手填哈希。未配置 = 启动失败(apiKey 不做白名单:它定义
  # ownerKey 命名空间,连上 hub 只能"看到" worker 目录,动 worker 数据须另持该 worker 的 apiKey)。
  # 安全整改(fail-closed):默认值为空,jar 内不再携带任何打包默认密钥——未显式配置即拒绝启动,
  # 不存在"缺省可本机试玩"的旁路。配置方式(任选其一,优先级从高到低):
  #   环境变量 HUB_KEY=xxx / 启动参数 --hub.hub-key=xxx / 本文件或
  #   ${EVERYAGENT_HOME}/application-hub.yaml 的 hub.hub-key。桌面版由 desktop 注入 HUB_KEY。
  hub-key: ${HUB_KEY:}
  max-frame-bytes: 16777216        # 单帧上限 16 MiB(应用层温和拦截;传输层升级策略按同值+64KiB 余量)
  pub-rate-per-second: 100         # 每连接 pub 令牌桶
  pub-burst: 100
  outbound-queue-limit: 1000       # 慢消费者保护:出口队列上限,溢出断开
  ping-interval-ms: 15000          # WS 协议层 ping 间隔
  stale-read-ms: 0                 # >0 时启用"无入站流量判死"(需 pong 可观测,默认关)
  hello-rate-per-minute: 60        # 单 IP hello 限速(防 key 枚举)
  # 控制台(CONSOLE appender)日志门槛:OFF=完全静默,本文件即「打包默认」。desktop 把 hub 的
  # stdout/stderr 重定向进 ~/.everyagent/logs/hub.out.log 且永不轮转,CONSOLE 开着会与
  # hub.log 双份落盘、无限膨胀(worker 侧同款问题);正式日志走 FILE(按日+按大小双维滚动,
  # 保留 7 天,见 logback-spring.xml)。IDE/开发运行由 application-dev.yml 置 INFO 恢复;
  # 打包环境临时排障:-Dhub.console-log-threshold=INFO
  console-log-threshold: OFF

logging:
  level:
    dev.everyagent.hub: INFO
